name: Download ALL TAF Files

on:
  workflow_dispatch:  # Solo click, nessun parametro

permissions:
  contents: write  # Permesso per push

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 5 tentativi per provincia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/cadastral-points-automation-niqBl
          fetch-depth: 0
          token: ${{ github.token }}  # Necessario per push

      - name: Check existing TAF files
        run: |
          echo "=== FILE TAF GIÀ PRESENTI ==="
          ls -la data/taf/*.TAF 2>/dev/null | wc -l | xargs echo "Totale esistenti:"
          ls data/taf/*.TAF 2>/dev/null || echo "Nessun file esistente"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create data directory
        run: mkdir -p data/taf

      - name: Download ALL TAF files
        run: python scripts/download_all_taf.py
        continue-on-error: true

      - name: Show results
        run: |
          echo "=== RISULTATO FINALE ==="
          TOTAL=$(ls data/taf/*.TAF 2>/dev/null | wc -l)
          echo "Totale file TAF: $TOTAL / 107 province"
          if [ "$TOTAL" -eq 107 ]; then
            echo "✅ TUTTE LE PROVINCE SCARICATE!"
          else
            MISSING=$((107 - TOTAL))
            echo "⚠️ Mancano $MISSING province"
            echo "Rilancia il workflow per riprovare i file mancanti"
          fi
          echo ""
          echo "=== ELENCO FILE ==="
          ls -la data/taf/*.TAF 2>/dev/null || echo "Nessun file"

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Mostra file da aggiungere
          echo "=== FILE DA COMMITTARE ==="
          git status --short

          # Aggiungi e committa
          git add data/taf/*.TAF 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nessun nuovo file da committare"
          else
            git commit -m "chore: Add TAF files (automated)"
            echo "=== PULL & PUSH ==="
            git pull --rebase origin claude/cadastral-points-automation-niqBl
            git push -v origin claude/cadastral-points-automation-niqBl
          fi

      - name: Upload as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: taf-files-all
          path: data/taf/*.TAF
          retention-days: 30
          if-no-files-found: warn
