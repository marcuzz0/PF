name: Download TAF Files

on:
  workflow_dispatch:
    inputs:
      provinces:
        description: 'Province da scaricare (es. RM,MI,TO) o "all" per tutte'
        required: true
        default: 'RM,MI,TO,NA,FI'
      force:
        description: 'Riscarica anche file esistenti'
        type: boolean
        default: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml selenium webdriver-manager

      - name: Create data directory
        run: mkdir -p data/taf

      - name: Download TAF files (Selenium)
        run: |
          # Prova prima con Selenium (bypassa protezioni anti-bot)
          python scripts/download_taf_selenium.py \
            ${{ inputs.provinces == 'all' && '--all' || format('--province {0}', inputs.provinces) }} \
            ${{ inputs.force && '--force' || '' }} \
            --headless \
            --output data/taf || echo "Selenium fallito, provo metodo diretto"

          # Fallback al metodo diretto per file mancanti
          python scripts/download_taf_manual.py \
            ${{ inputs.provinces == 'all' && '--all' || format('--province {0}', inputs.provinces) }} \
            --output data/taf

      - name: List downloaded files
        run: |
          echo "=== File TAF scaricati ==="
          ls -la data/taf/*.TAF 2>/dev/null || echo "Nessun file scaricato"
          echo ""
          echo "=== Statistiche ==="
          find data/taf -name "*.TAF" | wc -l | xargs echo "Totale file:"

      - name: Upload TAF files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: taf-files
          path: data/taf/*.TAF
          retention-days: 30
          if-no-files-found: warn

      - name: Commit TAF files (optional)
        if: ${{ github.event.inputs.provinces != 'all' }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/taf/*.TAF 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: Add TAF files for ${{ inputs.provinces }}"
          git push || echo "Push failed - files available as artifact"
