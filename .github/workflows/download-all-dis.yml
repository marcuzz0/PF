name: Download ALL DIS Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/cadastral-points-automation-niqBl
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check existing DIS files
        run: |
          echo "=== FILE DIS GIÀ PRESENTI ==="
          ls -la data/dis/*.DIST 2>/dev/null | wc -l | xargs echo "Totale esistenti:"
          ls data/dis/*.DIST 2>/dev/null || echo "Nessun file esistente"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create data directory
        run: mkdir -p data/dis

      - name: Download ALL DIS files
        run: python scripts/download_all_dis.py
        continue-on-error: true

      - name: Show results
        run: |
          echo "=== RISULTATO FINALE ==="
          TOTAL=$(ls data/dis/*.DIST 2>/dev/null | wc -l)
          echo "Totale file DIS: $TOTAL / 103 province"
          if [ "$TOTAL" -ge 103 ]; then
            echo "✅ TUTTE LE PROVINCE SCARICATE!"
          else
            MISSING=$((103 - TOTAL))
            echo "⚠️ Mancano $MISSING province"
          fi
          echo ""
          echo "=== ELENCO FILE ==="
          ls -la data/dis/*.DIST 2>/dev/null || echo "Nessun file"

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/dis/*.DIST 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nessun nuovo file da committare"
          else
            git commit -m "chore: Add DIS files (automated)"
            git pull --rebase origin claude/cadastral-points-automation-niqBl
            git push -v origin claude/cadastral-points-automation-niqBl
          fi

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dis-files-all
          path: data/dis/*.DIST
          retention-days: 30
          if-no-files-found: warn
